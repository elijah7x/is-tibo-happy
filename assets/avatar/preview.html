<!doctype html>
<meta charset="utf-8">
<title>Owner-approved Tibo avatars</title>
<style>
  :root { color-scheme: light dark; font-family: ui-monospace, monospace; }
  body { margin: 32px; background: Canvas; color: CanvasText; }
  h1 { font-size: 20px; }
  p { max-width: 760px; color: GrayText; }
  .states { display: flex; gap: 32px; flex-wrap: wrap; margin-top: 28px; }
  figure { margin: 0; display: grid; gap: 12px; }
  canvas { width: 192px; height: 192px; image-rendering: pixelated; border-radius: 24px; }
  figcaption { font-size: 13px; }
</style>
<h1>OWNER APPROVED FINAL · final11</h1>
<p>Production preview rendered directly from <code>avatar.json</code>. HAPPY and UNHAPPY are the only image variants; WAITING reuses HAPPY.</p>
<div class="states" id="states"></div>
<script type="module">
  const avatar = await fetch('./avatar.json').then(response => response.json());
  for (const state of ['happy', 'unhappy']) {
    const figure = document.createElement('figure');
    const canvas = document.createElement('canvas');
    canvas.width = avatar.grid;
    canvas.height = avatar.grid;
    const context = canvas.getContext('2d');
    avatar.variants[state].forEach((row, y) => [...row].forEach((symbol, x) => {
      context.fillStyle = avatar.palette[symbol];
      context.fillRect(x, y, 1, 1);
    }));
    const caption = document.createElement('figcaption');
    caption.textContent = `${state.toUpperCase()} · 48×48 source shown at 4× nearest-neighbor`;
    figure.append(canvas, caption);
    document.querySelector('#states').append(figure);
  }
</script>
