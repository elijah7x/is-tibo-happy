name: mirror
on:
  schedule:
    - cron: '*/20 * * * *'   # 每 20 分钟抓一次源站
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - run: node tools/mirror-fetch.mjs
      - name: commit state.json
        run: |
          git config user.name "is-tibo-happy-bot"
          git config user.email "is-tibo-happy-bot@users.noreply.github.com"
          git add public/state.json
          git diff --cached --quiet && exit 0
          git commit -m "mirror: forecast $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
      # jsDelivr @main 边缘缓存最长 12h > 客户端 6h 新鲜窗，push 后主动失效
      - run: curl -fsS -X POST "https://purge.jsdelivr.net/gh/elijah7x/is-tibo-happy@main/public/state.json" || true
